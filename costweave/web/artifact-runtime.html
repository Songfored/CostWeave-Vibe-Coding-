<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08110f">
  <title>产物运行台 · CostWeave</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/artifact-runtime.css">
  <script src="/artifact-runtime.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#workspace">跳到运行台</a>
  <header class="topbar">
    <a class="brand" href="/" aria-label="CostWeave 首页">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>CostWeave</span>
    </a>
    <a class="back-link" href="/">返回调度台</a>
  </header>
  <main id="workspace" class="artifact-workspace">
    <h1>产物运行台</h1>
    <p class="intro">设置目标产物、可用操作和预算，查看验收结果与每次尝试的记录。</p>
    <div class="artifact-grid">
      <section class="panel" aria-labelledby="job-title">
        <div class="panel-heading"><h2 id="job-title">运行任务</h2></div>
        <form id="job-form">
          <div class="identity-fields">
            <label>项目<input id="project" type="text" required maxlength="64" autocomplete="off"></label>
            <label>运行编号<input id="run-id" type="text" required maxlength="96" autocomplete="off"></label>
          </div>
          <div class="editor-heading">
            <label for="job">任务 JSON</label>
            <button id="example" type="button" class="text-button">载入交接单示例</button>
          </div>
          <textarea id="job" rows="16" required spellcheck="false" autocapitalize="off"></textarea>
          <div class="buttons">
            <button type="submit" class="primary-button compact">提交运行</button>
            <button id="inspect" type="button" class="secondary-button">查询记录</button>
            <button id="resume" type="button" class="secondary-button">继续运行</button>
          </div>
          <p id="message" class="form-error" role="alert"></p>
        </form>
      </section>
      <section class="panel" aria-labelledby="result-title" aria-busy="false" id="result-panel">
        <div class="panel-heading"><h2 id="result-title">运行结果</h2><span id="status" class="status-pill" role="status">待提交</span></div>
        <p id="scope"></p>
        <p id="budget"></p>
        <p id="risk"></p>
        <p id="reason"></p>
        <form id="clarification-form" hidden>
          <label for="clarification-value" id="clarification-label">补充资料（JSON）</label>
          <p id="clarification-note"></p>
          <textarea id="clarification-value" rows="4" required spellcheck="false" aria-describedby="clarification-note"></textarea>
          <button type="submit" class="secondary-button">提交资料并继续</button>
        </form>
        <h3>已验收的目标产物</h3>
        <pre id="outputs">暂无产物</pre>
        <h3 id="reconcile-title" hidden>人工核对</h3>
        <form id="reconcile-form" class="reconcile-box" hidden>
          <div class="identity-fields">
            <label>尝试编号<input id="rec-attempt" type="text" placeholder="attempt_id" autocomplete="off"></label>
            <label>核对结果
              <select id="rec-outcome">
                <option value="returned">已获得结果 (returned)</option>
                <option value="confirmed_failed">确认已失败 (confirmed_failed)</option>
              </select>
            </label>
          </div>
          <label class="rec-label">实际扣费（微美分/单位，可留空按报价）<input id="rec-units" type="number" min="0" step="1"></label>
          <label class="rec-label">返回 JSON 值（outcome=returned 时必填）<textarea id="rec-value" rows="3" spellcheck="false">{}</textarea></label>
          <div class="buttons"><button type="submit" class="secondary-button">提交核对并恢复</button></div>
        </form>
        <h3>决策审计与微美分账本（BSAO*）</h3>
        <pre id="audit-view">暂无审计记录</pre>
        <h3>执行记录</h3>
        <p id="events-note">查询或提交任务后显示。</p>
        <ol id="events"></ol>
      </section>
    </div>
  </main>
</body>
</html>
