[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "costweave"
version = "0.5.6.4.4"
description = "Cross-provider expected-value control plane for cost-aware multi-model orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CostWeave Contributors" }]
keywords = ["agent", "orchestration", "dag", "llm-router", "multi-agent"]

[project.scripts]
costweave = "costweave.server:main"
costweave-evaluate = "costweave.baseline_runner:main"
costweave-dataset = "costweave.outcome_dataset:main"

[tool.setuptools.packages.find]
include = ["costweave*"]

[tool.setuptools.package-data]
costweave = ["web/*", "migrations/*.sql", "benchmarks/*.json"]
