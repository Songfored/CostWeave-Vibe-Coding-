[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "costweave"
version = "0.6.7"
description = "Cross-provider expected-value control plane for cost-aware multi-model orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CostWeave Contributors" }]
keywords = ["agent", "orchestration", "dag", "llm-router", "multi-agent"]

[project.scripts]
costweave = "costweave.server:main"
costweave-evaluate = "costweave.baseline_runner:main"
costweave-dataset = "costweave.outcome_dataset:main"
costweave-release = "costweave.release_cli:main"
costweave-tournament = "costweave.tournament_cli:main"
costweave-metacontroller = "costweave.meta_controller_cli:main"
costweave-capability-router = "costweave.capability_router_cli:main"
costweave-joint-search = "costweave.joint_search_cli:main"
costweave-execution-recovery = "costweave.execution_recovery_cli:main"
costweave-safe-learning = "costweave.safe_learning_cli:main"

[tool.setuptools.packages.find]
include = ["costweave*"]

[tool.setuptools.package-data]
costweave = ["web/*", "migrations/*.sql", "benchmarks/*.json"]
