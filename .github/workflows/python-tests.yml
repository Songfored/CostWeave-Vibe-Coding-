name: Python compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - name: Check installed command-line entry points
        working-directory: ${{ runner.temp }}
        run: |
          costweave --host 127.0.0.1 --help
          costweave-evaluate --help
          costweave-release --help
          costweave-tournament --help
      - name: Run the test suite
        run: python -B -m unittest discover -s tests -p 'test*.py' -q
